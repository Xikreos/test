<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IRIS</title>
<style>
:root{--a:#9cc3ff;--bg:#0b0f16;--tx:#fff;--g:rgba(255,255,255,.14);--gb:rgba(255,255,255,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f16}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#fake{position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,170,110,.55),transparent 40%),radial-gradient(circle at 80% 20%,rgba(120,150,255,.5),transparent 45%),radial-gradient(circle at 60% 80%,rgba(255,110,150,.35),transparent 45%),linear-gradient(#26324a,#0f1522)}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.45),transparent 28%,transparent 55%,rgba(0,0,0,.6))}
.glass{background:var(--g);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--gb);border-radius:26px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500}
.pill{padding:8px 14px;border-radius:30px;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.focus{position:absolute;left:50%;top:43%;width:64px;height:64px;transform:translate(-50%,-50%);pointer-events:none;opacity:.8}
.focus i{position:absolute;width:16px;height:16px;border:2px solid rgba(255,255,255,.85);border-radius:5px}
.focus i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.focus i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}.focus i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.focus i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.focus{animation:br 3.2s ease-in-out infinite}@keyframes br{50%{transform:translate(-50%,-50%) scale(1.15);opacity:.4}}
.mode{position:absolute;inset:0;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .5s,transform .5s}
.mode.on{opacity:1;transform:none}
.sm{font-size:12px;opacity:.7;font-weight:500}
.nav1{position:absolute;top:calc(env(safe-area-inset-top,0px) + 66px);left:16px;right:16px;padding:16px 18px;display:flex;gap:16px;align-items:center}
.ico{width:56px;height:56px;border-radius:50%;background:var(--a);color:#0b1426;display:grid;place-items:center;font-size:30px;font-weight:700}
.big{font-size:32px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.path{position:absolute;left:50%;bottom:210px;width:150px;height:170px;transform:translateX(-50%);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.path i{width:0;height:0;border-left:var(--w) solid transparent;border-right:var(--w) solid transparent;border-bottom:calc(var(--w)*.6) solid rgba(156,195,255,.95);filter:drop-shadow(0 0 10px rgba(156,195,255,.8));opacity:.2;animation:fl 1.5s infinite}
@keyframes fl{50%{opacity:1}}
.meet{position:absolute;left:16px;bottom:128px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:15px;font-weight:600}
.meet .sm{display:block;font-weight:400}
.speed{position:absolute;right:16px;bottom:128px;padding:10px 18px;text-align:center;font-size:26px;font-weight:600}
.tcard{position:absolute;left:16px;right:16px;bottom:128px;padding:18px 20px}
.tl{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lang{font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;background:rgba(255,255,255,.18)}
.live{font-size:12px;display:flex;gap:6px;align-items:center}.live b{width:7px;height:7px;border-radius:50%;background:#ff5a5f;animation:fl 1.2s infinite}
.en{font-size:17px;opacity:.65;min-height:24px}
.de{font-size:27px;font-weight:600;letter-spacing:-.01em;min-height:70px;margin-top:6px;line-height:1.25}
.chip{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 66px);padding:10px 16px;font-size:14px;font-weight:500}
.hgrid{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 66px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tile{padding:14px 12px 10px}.tile .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}.tile small{font-size:13px;font-weight:400;opacity:.7}
.tile svg{width:100%;height:30px;margin-top:6px}.tile polyline{fill:none;stroke:var(--a);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.run{position:absolute;left:16px;right:16px;bottom:128px;padding:16px 22px;display:flex;justify-content:space-between;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.run span span{font-size:12px;display:block;opacity:.65;font-weight:500}
.dock{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:6px;display:flex;gap:4px;align-items:center;z-index:4;border-radius:34px}
.dock button{flex:1;padding:13px 4px;border-radius:28px;border:0;background:transparent;color:rgba(255,255,255,.75);font-size:13px;font-weight:600}
.dock button.on{background:rgba(255,255,255,.95);color:#0b1426}
.dock .rb{flex:0 0 44px;padding:12px 0;font-size:16px}
#boot{position:absolute;inset:0;z-index:5;pointer-events:auto;background:radial-gradient(circle at 50% 35%,#1d2a44,#0b0f16 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .8s}
#boot.off{opacity:0;pointer-events:none}
.ring{width:90px;height:90px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--a);animation:sp 1.1s linear infinite;display:grid;place-items:center}
@keyframes sp{to{transform:rotate(360deg)}}
#boot h1{font-size:40px;font-weight:200;letter-spacing:.35em;margin-left:.35em}
#boot p{font-size:14px;opacity:.65;min-height:20px}
.bar{width:54%;height:4px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--a);border-radius:3px}
.cta{margin-top:12px;padding:15px 34px;border-radius:30px;border:0;background:#fff;color:#0b1426;font-size:16px;font-weight:600}
.cta2{background:none;border:0;color:rgba(255,255,255,.65);font-size:14px;padding:6px}
.tag{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 52px);text-align:center;font-size:11px;opacity:.55}
</style>
</head>
<body>
<video id="bg" autoplay playsinline muted></video>
<div id="fake"></div><div id="shade"></div>
<div class="focus"><i></i><i></i><i></i><i></i></div>
<div class="top"><div class="glass pill"><span id="clock">17:24</span><span class="sm">☀︎ 18 °</span></div><div class="glass pill"><span id="batt">92 %</span></div></div>
<div class="tag"></div>

<section class="mode" id="m-nav">
<div class="glass nav1"><div class="ico">↑</div><div><div class="sm">Geradeaus</div><div class="big">In <span id="dist">300</span> m</div><div style="font-size:15px;opacity:.85">Richtung Hauptbahnhof</div></div></div>
<div class="path" id="path"></div>
<div class="glass meet"><span style="font-size:22px">📅</span><div>Meeting in 36 Min<span class="sm">Büro, 2. OG</span></div></div>
<div class="glass speed"><span id="spd">32</span><span class="sm"> km/h</span></div>
</section>

<section class="mode" id="m-tr">
<div class="glass chip">📖 Café Central · Menü erkannt</div>
<div class="glass tcard"><div class="tl"><span class="lang">Englisch → Deutsch</span><span class="live"><b></b>Live</span></div><div class="en" id="en"></div><div class="de" id="de"></div></div>
</section>

<section class="mode" id="m-h">
<div class="hgrid">
<div class="glass tile"><div class="sm">♡ Puls</div><div class="v"><span id="hr">72</span> <small>bpm</small></div><svg viewBox="0 0 100 30"><polyline id="l1"/></svg></div>
<div class="glass tile"><div class="sm">Sauerstoff</div><div class="v"><span id="ox">98</span> <small>%</small></div><svg viewBox="0 0 100 30"><polyline id="l2"/></svg></div>
<div class="glass tile"><div class="sm">Temperatur</div><div class="v"><span id="tp">36,6</span><small> °C</small></div><svg viewBox="0 0 100 30"><polyline id="l3"/></svg></div>
</div>
<div class="glass run"><span><span>Strecke</span><b id="km">5,2</b> km</span><span><span>Zeit</span><b id="tm">24:18</b></span><span><span>Status</span>Alles gut</span></div>
</section>

<div class="glass dock" id="tabs"><button data-m="nav">Navigation</button><button data-m="tr">Übersetzer</button><button data-m="h">Health</button><button class="rb" id="flip">⟲</button><button class="rb" id="auto">⏸</button></div>

<div id="boot">
<div class="ring"></div><h1>IRIS</h1><p id="bt">Wird gestartet …</p><div class="bar"><i id="bi"></i></div>
<button class="cta" id="cam">Mit Kamera starten</button>
<button class="cta2" id="nocam">Ohne Kamera</button>
</div>

<script>
var $=function(s){return document.querySelector(s)};
var modes=['nav','tr','h'],cur='nav',auto=true,timer=null,face='environment',stream=null;
var p=$('#path');for(var i=0;i<5;i++){var e=document.createElement('i');e.style.setProperty('--w',(64-i*10)+'px');e.style.animationDelay=(i*0.18)+'s';p.appendChild(e)}
function note(t){$('.tag').textContent=t}
function show(m){cur=m;modes.forEach(function(x){$('#m-'+x).classList.toggle('on',x===m)});
 document.querySelectorAll('#tabs [data-m]').forEach(function(b){b.classList.toggle('on',b.dataset.m===m)});
 if(navigator.vibrate)navigator.vibrate(12);if(m==='tr')startTrans()}
function next(){show(modes[(modes.indexOf(cur)+1)%3])}
function sched(){clearInterval(timer);if(auto)timer=setInterval(next,14000)}
document.querySelectorAll('#tabs [data-m]').forEach(function(b){b.onclick=function(){auto=false;$('#auto').textContent='⏵';sched();show(b.dataset.m)}});
$('#auto').onclick=function(){auto=!auto;this.textContent=auto?'⏸':'⏵';sched();if(auto)next()};
function clk(){$('#clock').textContent=new Date().toTimeString().slice(0,5)}clk();setInterval(clk,1000);
var dist=300;setInterval(function(){dist-=3;if(dist<20)dist=300;$('#dist').textContent=dist;$('#spd').textContent=30+Math.round(Math.random()*4)},400);
var lines=[["Good morning! Did you sleep well?","Guten Morgen! Hast du gut geschlafen?"],["The meeting starts at ten.","Das Meeting beginnt um zehn Uhr."],["Shall we get a coffee first?","Wollen wir vorher einen Kaffee holen?"],["I’ll send you the report today.","Ich schicke dir heute den Bericht."]];
var tt=null,li=0,tgen=0;
function type(el,txt,cb){var i=0;el.textContent='';clearInterval(tt);tt=setInterval(function(){el.textContent=txt.slice(0,++i);if(i>=txt.length){clearInterval(tt);cb&&setTimeout(cb,350)}},32)}
function startTrans(){var g=++tgen;li=0;(function step(){if(g!==tgen||cur!=='tr')return;var L=lines[li%lines.length];$('#de').textContent='';
 type($('#en'),L[0],function(){if(g!==tgen)return;type($('#de'),L[1],function(){li++;setTimeout(step,1800)})})})()}
var data=[[],[],[]];for(var k=0;k<30;k++){data[0].push(72);data[1].push(98);data[2].push(36.6)}
function spark(id,a,mn,mx){$(id).setAttribute('points',a.map(function(v,i){return (i*100/29)+','+(27-(v-mn)/(mx-mn)*24)}).join(' '))}
var sec=1458;
setInterval(function(){var hr=72+Math.round(Math.sin(Date.now()/900)*5+Math.random()*3),ox=97+Math.round(Math.random()*2),tp=36.5+Math.random()*.2;
 [hr,ox,tp].forEach(function(v,i){data[i].push(v);data[i].shift()});
 $('#hr').textContent=hr;$('#ox').textContent=ox;$('#tp').textContent=tp.toFixed(1).replace('.',',');
 spark('#l1',data[0],60,85);spark('#l2',data[1],95,100);spark('#l3',data[2],36.3,36.9);
 sec++;$('#tm').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('#km').textContent=(5.2+(sec-1458)*0.0028).toFixed(1).replace('.',',')},600);
function startCam(f){face=f;if(stream)stream.getTracks().forEach(function(t){t.stop()});
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:f}},audio:false}).catch(function(){return navigator.mediaDevices.getUserMedia({video:true,audio:false})}).then(function(s){stream=s;var v=$('#bg');v.srcObject=s;v.style.display='block';$('#fake').style.display='none';v.play();note('Live-Kamera aktiv')}).catch(function(){note('Kamera gesperrt – Seite direkt in Safari öffnen')})}
$('#flip').onclick=function(){if(stream)startCam(face==='environment'?'user':'environment')};
function boot(){var t=0,m=['Sensoren werden kalibriert …','KI wird geladen …','Bereit'];
 var iv=setInterval(function(){t+=2;$('#bi').style.width=t+'%';$('#bt').textContent=m[Math.min(2,Math.floor(t/34))];if(t>=100){clearInterval(iv);setTimeout(function(){$('#boot').classList.add('off');show('nav');sched()},400)}},45)}
function begin(c){$('#cam').style.display=$('#nocam').style.display='none';
 if(c&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)startCam('environment');else if(c)note('Kamera nicht verfügbar – Safari nutzen');boot()}
$('#cam').onclick=function(){begin(true)};$('#nocam').onclick=function(){begin(false)};
</script>
</body>
</html>
